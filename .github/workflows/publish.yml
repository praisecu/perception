name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the book
        run: quarto render
      # Until release, the root shows the landing page in landing/ and the
      # book is served from an unlisted path kept in the PREVIEW_PATH secret.
      # At release, delete this step and upload _book directly.
      - name: Assemble the site
        env:
          PREVIEW_PATH: ${{ secrets.PREVIEW_PATH }}
        run: |
          test -n "$PREVIEW_PATH"
          mkdir -p _site
          cp -r landing/. _site/
          sed -i "s|__PREVIEW_PATH__|$PREVIEW_PATH|g" _site/index.html
          cp CNAME _site/
          cp -r _book "_site/$PREVIEW_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
