project:
  type: book
  output-dir: _book
  resources:
    - CNAME
    - logo.webp
    - demos/*.js

book:
  title: "Perception"
  subtitle: "How robots see, sense and understand the world"
  author: "Chahat Deep Singh"
  site-url: https://perception.praisecu.com
  repo-url: https://github.com/praisecu/perception
  repo-actions: [edit, issue]
  favicon: logo.webp
  search:
    location: navbar
    type: overlay
  page-footer:
    center: "PRAISe Lab, University of Colorado Boulder · [praisecu.com](https://www.praisecu.com)"

  # The praisecu.com header, with the same links.
  navbar:
    logo: assets/cu-logo.webp
    logo-alt: "University of Colorado Boulder"
    logo-href: https://www.praisecu.com
    title: "PRAISe Lab"
    href: https://www.praisecu.com
    right:
      - text: Research
        menu:
          - text: Publications
            href: https://www.praisecu.com/publications.html
          - text: Research Areas
            href: https://www.praisecu.com/research-areas.html
          - text: Blog
            href: https://www.praisecu.com/blog/
      - text: Teaching
        href: https://www.praisecu.com/teaching.html
      - text: Team
        href: https://www.praisecu.com/team.html
      - text: Media
        href: https://www.praisecu.com/media.html
      - text: Openings
        href: https://www.praisecu.com/openings.html

  # The table of contents. Add, remove or reorder chapters here.
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/images.qmd
        - chapters/edges.qmd

format:
  live-html:
    theme:
      light: [cosmo, assets/book.scss, assets/book-light.scss]
      dark: [darkly, assets/book.scss, assets/book-dark.scss]
    respect-user-color-scheme: true
    css: assets/demos.css
    number-sections: true
    toc: true
    toc-title: "On this page"
    code-copy: true
    smooth-scroll: true
