project:
  type: book
  output-dir: _book
  resources:
    - CNAME
    - logo.webp
    - demos/*.js
    - assets/cu-logo.webp
    - assets/praise/*

book:
  title: "Perception"
  subtitle: "How robots see, sense and understand the world"
  author: "Chahat Deep Singh"
  site-url: https://perception.praisecu.com
  repo-url: https://github.com/praisecu/perception
  repo-actions: [edit, issue]
  favicon: logo.webp
  search:
    location: sidebar
    type: overlay
  page-footer:
    center: "PRAISe Lab, University of Colorado Boulder · [praisecu.com](https://www.praisecu.com)"


  # The table of contents. Add, remove or reorder chapters here.
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/images.qmd
        - chapters/edges.qmd

format:
  live-html:
    theme:
      light: [cosmo, assets/book.scss, assets/book-light.scss]
      dark: [darkly, assets/book.scss, assets/book-dark.scss]
    respect-user-color-scheme: true
    css: assets/demos.css
    # The praisecu.com header (assets/praise/), shared with the lab site.
    include-in-header: assets/praise/head.html
    include-before-body: assets/praise/header.html
    number-sections: true
    toc: true
    toc-title: "On this page"
    code-copy: true
    smooth-scroll: true
