project:
  type: book
  output-dir: _book
  resources:
    - CNAME
    - logo.webp
    - demos/*.js
    - assets/cu-logo.webp
    - assets/praise/*
    - chapters/media/**

book:
  title: "Fundamentals of Robot Perception"
  subtitle: "How robots see, sense and understand the world"
  author: "Chahat Deep Singh"
  site-url: https://perception.praisecu.com
  repo-url: https://github.com/praisecu/perception
  repo-actions: [edit, issue]
  favicon: logo.webp
  search:
    location: sidebar
    type: overlay


  # The table of contents. Add, remove or reorder chapters here.
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - part: "Images and Cameras"
      chapters:
        - chapters/image-formation.qmd
    - part: "Features"
      chapters:
        - chapters/features.qmd
    - part: "Geometry"
      chapters:
        - chapters/transformations.qmd
        - chapters/camera-models.qmd
        - chapters/curves-rendering.qmd
        - chapters/single-view.qmd
    - part: "Computational Imaging"
      chapters:
        - chapters/computational-imaging.qmd
        - chapters/learned-depth.qmd
    - part: "Multiple Views"
      chapters:
        - chapters/stereo.qmd
        - chapters/sfm.qmd
    - part: "Neural Scene Representations"
      chapters:
        - chapters/volumetric.qmd
        - chapters/nerf.qmd
        - chapters/gaussian-splatting.qmd

format:
  live-html:
    theme:
      light: [cosmo, assets/book.scss, assets/book-light.scss]
      dark: [darkly, assets/book.scss, assets/book-dark.scss]
    respect-user-color-scheme: true
    css: assets/demos.css
    # The praisecu.com header (assets/praise/), shared with the lab site.
    include-in-header: assets/praise/head.html
    include-before-body: assets/praise/header.html
    include-after-body: assets/praise/footer.html
    number-sections: true
    toc: true
    toc-title: "On this page"
    code-copy: true
    smooth-scroll: true
