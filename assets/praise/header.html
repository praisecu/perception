<header class="modern-header">
  <div class="modern-header__inner">
    <a class="modern-header__brand" href="https://www.praisecu.com/" aria-label="PRAISe Lab home">
      <img
        class="modern-header__logo"
        src="/assets/cu-logo.webp"
        alt="University of Colorado Boulder"
      >

      <span class="modern-header__name">PRAISe Lab</span>
    </a>

    <button
      class="theme-toggle theme-toggle--mobile"
      type="button"
      data-theme-toggle
      aria-label="Switch to dark mode"
      aria-pressed="false"
      title="Switch to dark mode"
    >
      <span class="theme-toggle__track" aria-hidden="true">
        <svg
          class="theme-toggle__icon theme-toggle__icon--sun"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="3.5"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
          ></path>
        </svg>

        <svg
          class="theme-toggle__icon theme-toggle__icon--moon"
          viewBox="0 0 24 24"
        >
          <path
            d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"
          ></path>
        </svg>

        <span class="theme-toggle__thumb"></span>
      </span>

      <span class="theme-toggle__label">
        Switch to dark mode
      </span>
    </button>

    <button
      class="modern-header__menu-button"
      type="button"
      aria-expanded="false"
      aria-controls="modern-header-navigation"
      aria-label="Open navigation menu"
    >
      <span class="modern-header__menu-line"></span>
      <span class="modern-header__menu-line"></span>
      <span class="modern-header__menu-line"></span>
    </button>

    <nav
  id="modern-header-navigation"
  class="modern-header__navigation"
  aria-label="Primary navigation"
>
  <button
    class="theme-toggle theme-toggle--desktop"
    type="button"
    data-theme-toggle
    aria-label="Switch to dark mode"
    aria-pressed="false"
    title="Switch to dark mode"
  >
      <span class="theme-toggle__track" aria-hidden="true">
      <svg
      class="theme-toggle__icon theme-toggle__icon--sun"
      viewBox="0 0 24 24"
      >
      <circle cx="12" cy="12" r="3.5"></circle>
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
      ></path>
      </svg>

      <svg
      class="theme-toggle__icon theme-toggle__icon--moon"
      viewBox="0 0 24 24"
      >
      <path
        d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"
      ></path>
      </svg>

      <span class="theme-toggle__thumb"></span>
    </span>

    <span class="theme-toggle__label">
      Switch to dark mode
    </span>
  </button>

  <div class="modern-header__dropdown">
    <button
      class="modern-header__link modern-header__dropdown-button"
      type="button"
      aria-expanded="false"
    >
      Research
      <i class="fa-solid fa-caret-down" aria-hidden="true"></i>
    </button>

    <div class="modern-header__dropdown-menu">
      <a href="https://www.praisecu.com/publications.html">Publications</a>
      <a href="https://www.praisecu.com/research-areas.html">Research Areas</a>
      <a href="https://www.praisecu.com/blog/">Blog</a>
    </div>
  </div>

  <a
    class="modern-header__link"
    href="https://www.praisecu.com/teaching.html"
  >
    Teaching
  </a>

  <a
    class="modern-header__link"
    href="https://www.praisecu.com/team.html"
  >
    Team
  </a>

  <a
    class="modern-header__link"
    href="https://www.praisecu.com/media.html"
  >
    Media
  </a>

  <a
    class="modern-header__link"
    href="https://www.praisecu.com/openings.html"
    
  >
    Openings
    
      <span class="nav-badge">New</span>
    
  </a>
</nav>
  </div>
</header>

<nav
  class="mobile-bottom-nav"
  aria-label="Mobile navigation"
>
  <a
    class="mobile-bottom-nav__item"
    href="https://www.praisecu.com/"
  >
    <i class="fa fa-home" aria-hidden="true"></i>
    <span>Home</span>
  </a>

  <a
    class="mobile-bottom-nav__item"
    href="https://www.praisecu.com/publications.html"

  </a>

  <a
    class="mobile-bottom-nav__item"

    type="button"

    aria-controls="mobile-more-menu"
  >
    <i class="fa fa-ellipsis-h" aria-hidden="true"></i>
    <span>More</span>
    
      <span class="nav-badge-dot" aria-hidden="true"></span>
    
  </button>
</nav>

<div
  id="mobile-more-menu"
  class="mobile-more-menu"
  aria-hidden="true"
>
  <button
    class="mobile-more-menu__backdrop"
    type="button"
    aria-label="Close navigation menu"
  ></button>

  <div
    class="mobile-more-menu__panel"
    role="dialog"
    aria-modal="true"
    aria-label="More navigation links"
  >
    <div class="mobile-more-menu__handle"></div>

    <div class="mobile-more-menu__heading">
      <span>More</span>

      <button
        class="mobile-more-menu__close"
        type="button"
        aria-label="Close menu"

    <div class="mobile-more-menu__links">
      <a href="https://www.praisecu.com/openings.html">

      </a>

      <a href="https://www.praisecu.com/blog/">
        <i class="fa fa-pencil" aria-hidden="true"></i>

      </a>

      <a href="https://www.praisecu.com/team.html">
        <i class="fa fa-users" aria-hidden="true"></i>
        <span>Team</span>
      </a>

      <a href="https://www.praisecu.com/media.html">
        <i class="fa fa-camera" aria-hidden="true"></i>

      </a>
    </div>
  </div>
</div>
